name: Weekly AI citation run

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC (08:17 Madrid)
  workflow_dispatch:
    inputs:
      engines:
        description: "Comma list: chatgpt,perplexity,google_aio"
        default: "chatgpt,perplexity,google_aio"
      limit:
        description: "Only first N prompts (0 = all; >0 = test run, kept out of history)"
        default: "0"
      repeats:
        description: "Runs per prompt"
        default: "3"

permissions:
  contents: write

# never run two at once — a second run waits for the first to finish
concurrency:
  group: ai-citation-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      LIMIT: ${{ inputs.limit || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run engines
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: >
          python -m tracker.run
          --engines "${{ inputs.engines || 'chatgpt,perplexity,google_aio' }}"
          --limit "$LIMIT"
          --repeats "${{ inputs.repeats || '3' }}"
      - name: Save results and build report
        if: ${{ always() }}
        run: |
          git config user.name "ai-citation-bot"
          git config user.email "actions@users.noreply.github.com"
          TEST_FLAG=""; [ "$LIMIT" != "0" ] && TEST_FLAG="--test"
          # 1) save raw data first (unique file per run, so it never conflicts)
          git add -A data
          git commit -q -m "AI citation raw data $(date -u +%F)" || true
          for i in 1 2 3; do
            git pull -q --rebase origin main
            BASE=$(git rev-parse HEAD)
            # 2) rebuild the report on top of the latest repo state
            python -m tracker.report $TEST_FLAG | tee -a "$GITHUB_STEP_SUMMARY"
            # 3) refresh the Vercel dashboard data (full runs only); Vercel redeploys on push
            [ -z "$TEST_FLAG" ] && python -m tracker.site
            git add data reports site
            git commit -q -m "AI citation report $(date -u +%F)" || true
            git push -q origin HEAD:main && exit 0
            echo "push rejected, retrying ($i)"; sleep 10
            git reset -q --hard "$BASE"   # drop only the report commit; raw data stays
          done
          exit 1
      - name: Notify Make (optional)
        if: ${{ env.MAKE_WEBHOOK_URL != '' && env.LIMIT == '0' }}
        run: |
          python - <<'EOF'
          import json, os, requests
          s = json.load(open("data/summary.json"))["weeks"][-1]
          payload = {"date": s["date"], "engines": {k: {kk: v[kk] for kk in
                     ("own_citation_rate","own_citation_share","own_mention_rate","own_target_hit_rate")}
                     for k, v in s["engines"].items()},
                     "report_url": f"https://github.com/${{ github.repository }}/blob/main/reports/{s['date']}.md"}
          requests.post(os.environ["MAKE_WEBHOOK_URL"], json=payload, timeout=30)
          EOF
